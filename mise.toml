# Toolchain pinning for tmm. See https://mise.jdx.dev
#
# Keep this in step with build.zig.zon's minimum_zig_version; they move
# together. The control-mode compositor work targets 0.16.0 and goes to 0.17.0
# once the dependency tree lands there (libvaxis PR 370, ghostty PR 14519, and
# a 0.17 branch of libtmux).
#
# Deliberately no ZIG_GLOBAL_CACHE_DIR here: packages currently resolve out of
# zig-pkg/, which is not a Zig convention and is not set by any env var or
# wrapper in the repo, so the mechanism is unconfirmed. Pinning it wrongly would
# silently move dependency resolution. Worth settling before the 0.17 port,
# since changed dep hashes will need fetching.
[tools]
zig = "0.16.0"

[tasks.test]
description = "Unit tests plus the control-mode and reconcile suites"
run = [
  # First, so a run killed by a timeout cannot distort this one: the suites
  # leave tmux servers and directories behind when they do not exit normally.
  "sh tools/clean-test-leftovers.sh",
  "zig build test",
  # Early, while the machine is still quiet. These assert a worst case, and a
  # worst case is sensitive to load: run late, after the suites that spawn
  # dozens of processes, they reported 13ms where the same build reports
  # 0.3ms on its own. Loosening the budget was the wrong answer, because the
  # regression this catches showed a 0.2ms median with a 29ms worst case.
  "env TMM_WCET_MS=25 python3 tests/keylag.py",
  "env TMM_WCET_MS=25 python3 tests/keylag_native.py",
  "python3 tests/keyscope.py --self-test",
  "python3 tests/control_mode.py",
  "python3 tests/reconcile_live.py",
  "python3 tests/reconcile_stress.py",
  "python3 tests/measure_queries.py",
  "python3 tests/follow.py",
  "python3 tests/split_shell.py",
  "python3 tests/compositor.py",
  "python3 tests/pane_churn.py",
  "python3 tests/pane_use_after_free.py",
  "python3 tests/key_release.py",
  "python3 tests/images.py",
  "python3 tests/program_status.py",
]

[tasks.latency]
description = "Latency on a quiet machine: the product, then the floors under it"
run = [
  "sh tools/clean-test-leftovers.sh",
  "python3 tests/keylag.py",
  "python3 tests/keylag_native.py",
  "python3 tests/pty_floor.py",
  "python3 tests/tmux_floor.py",
]

[tasks.clean-tests]
description = "Remove tmux servers and directories a killed test run left in /tmp"
run = ["sh tools/clean-test-leftovers.sh"]

[tasks.deps-check]
description = "How far behind is the vendored libghostty-vt, and what changed"
run = ["sh tools/deps-check.sh"]

[tasks.floors]
description = "Reference latency floors: the machine and tmux, measured alone"
run = [
  "python3 tests/pty_floor.py",
  "python3 tests/tmux_floor.py",
]

[tasks.probe]
description = "Control-mode probe: mise run probe -- -S <socket> -t <session>"
run = "zig build cmprobe --"
