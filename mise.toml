# Toolchain pinning for tmm. See https://mise.jdx.dev
#
# Keep this in step with build.zig.zon's minimum_zig_version; they move
# together. tmm targets 0.16.0 and goes to 0.17.0 once its dependencies land
# there (libvaxis PR 370 and a 0.17 branch of libtmux).
#
# Deliberately no ZIG_GLOBAL_CACHE_DIR here: packages currently resolve out of
# zig-pkg/, which is not a Zig convention and is not set by any env var or
# wrapper in the repo, so the mechanism is unconfirmed. Pinning it wrongly would
# silently move dependency resolution. Worth settling before the 0.17 port,
# since changed dep hashes will need fetching.
[tools]
zig = "0.16.0"

[tasks.test]
description = "Unit tests plus the control-mode and reconcile suites"
run = [
  # First, so a run killed by a timeout cannot distort this one: the suites
  # leave tmux servers and directories behind when they do not exit normally.
  "sh tools/clean-test-leftovers.sh",
  "zig build test",
  # The end-to-end tests drive zig-out/bin/tmm, which `zig build test` does
  # not produce: without this they test whatever was built last.
  "zig build",
  # Side by side; see tests/run.py.
  """python3 tests/run.py \
    tests/control_mode.py tests/reconcile_live.py tests/reconcile_stress.py \
    tests/measure_queries.py tests/follow.py tests/exit_clean.py \
    tests/agent_hooks_sidebar.py tests/claude_hook.py tests/reported_lifetime.py \
    tests/fold.py tests/hover.py tests/integration.py""",
]

[tasks.clean-tests]
description = "Remove tmux servers and directories a killed test run left in /tmp"
run = ["sh tools/clean-test-leftovers.sh"]

[tasks.probe]
description = "Control-mode probe: mise run probe -- -S <socket> -t <session>"
run = "zig build cmprobe --"
